<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unlocked – Access Management prototype</title>
<!-- Standalone build of github.com/comstocktylerj12/Unlocked: runtime inlined, no external files. -->
<style>
body{margin:0;background:#F2F2F2;color:#111;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.45}
*,*::before,*::after{box-sizing:border-box;border-radius:0}
sc-for,sc-if{display:contents}
a,a:hover{color:#111}
:focus-visible{outline:2px solid #111;outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding:10px 20px;background:#fff;border-bottom:1px solid #CCC;position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;flex:1 1 0}
.search{position:relative;flex:2 1 320px;max-width:600px}
.sinp{width:100%;height:40px;padding:0 12px 0 36px;border:1px solid #888;font:inherit;background:#fff;color:inherit}
.sicon{position:absolute;left:11px;top:11px;color:#555;pointer-events:none}
.sres{position:absolute;top:44px;left:0;right:0;background:#fff;border:1px solid #888;box-shadow:0 6px 18px rgba(0,0,0,.15);z-index:20;padding:6px;max-height:420px;overflow:auto}
.sitem{display:flex;width:100%;gap:10px;align-items:flex-start;text-align:left;padding:8px 10px;border:0;background:none;font:inherit;cursor:pointer;color:inherit}
.sitem:hover,.sitem:focus{background:#EAEAEA;outline:none}
.kind{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#555;min-width:72px;padding-top:2px}
.who{position:relative;flex:1 1 0;display:flex;justify-content:flex-end}
.whob{display:flex;align-items:center;gap:8px;border:1px solid transparent;background:none;padding:4px 8px;font:inherit;color:inherit;cursor:pointer;text-align:left;min-height:44px}
.whob:hover,.whob[aria-expanded="true"]{background:#EEE;border-color:#CCC}
.umenu{position:absolute;right:0;top:calc(100% + 6px);min-width:290px;background:#fff;border:1px solid #888;box-shadow:0 8px 22px rgba(0,0,0,.16);padding:6px;z-index:30;display:flex;flex-direction:column;gap:2px}
.mhead{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#555;padding:6px 10px 4px}
.mitem{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;font:inherit;color:inherit;cursor:pointer;min-height:44px}
.mitem:hover,.mitem:focus,.mitem.on{background:#EAEAEA;outline:none}
.av{width:34px;height:34px;background:#DDD;display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.shell{display:flex;flex-wrap:wrap;flex:1;align-items:flex-start}
.side{flex:1 1 210px;max-width:240px;padding:16px 12px;display:flex;flex-direction:column;gap:2px}
.navb{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:9px 12px;font:inherit;color:#333;cursor:pointer;min-height:40px}
.navb:hover{background:#E6E6E6}
.navb.on{background:#fff;color:#111;font-weight:600;box-shadow:inset 3px 0 0 #111,0 0 0 1px #CCC}
.badge{background:#111;color:#fff;font-size:11px;padding:1px 7px;font-weight:600}
.sidehelp{margin-top:16px;padding:12px;border:1px dashed #888;font-size:13px;color:#333;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.main{flex:999 1 560px;min-width:0;padding:22px 28px 56px}
.wrap{max-width:1240px}
h1{font-size:24px;margin:0}
h2{font-size:16px;margin:0}
h3{font-size:14px;margin:0}
.sub{color:#555;margin:4px 0 0}
.card{background:#fff;border:1px solid #CCC}
.pad{padding:16px 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 14px;border:1px solid #777;background:#fff;color:#111;font:inherit;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:#EEE}
.btn.pri{background:#111;border-color:#111;color:#fff}
.btn.pri:hover{background:#333}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{border-style:dashed;border-color:#111}
.btn.inv{background:#fff;color:#111;border-color:#fff}
.btn.invg{background:none;color:#fff;border-color:#888}
.link{border:0;background:none;color:#111;font:inherit;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border:1px solid #777;background:#fff;color:#111;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;background:currentColor}
.ok{border-style:solid}
.warn{border-style:dashed;border-color:#111}
.pend{border-style:dotted;border-color:#111}
.bad{background:#111;color:#fff;border-color:#111}
.mute{background:#F2F2F2;color:#555;border-color:#BBB}
.tbl{overflow-x:auto}
.dt{display:flex;flex-direction:column;min-width:760px}
.tr{display:grid;gap:12px;padding:11px 16px;border-bottom:1px solid #E4E4E4;align-items:start}
.tr:last-child{border-bottom:0}
.th{font-size:12px;font-weight:600;color:#555;padding:8px 16px;background:#F7F7F7;border-bottom:1px solid #CCC}
.tr.sel{background:#EAEAEA}
.c-acc{grid-template-columns:minmax(200px,2.2fr) 1.2fr .9fr 1.2fr .9fr 1.1fr 120px}
.c-req{grid-template-columns:28px 92px minmax(180px,2fr) 1fr .9fr 1.2fr minmax(150px,1.5fr) 80px}
.c-ap{grid-template-columns:28px 86px minmax(150px,1.3fr) minmax(170px,1.6fr) minmax(140px,1.2fr) 1.1fr 130px 84px}
.c-dir{grid-template-columns:28px minmax(200px,2fr) 1fr 1fr 1.1fr 1fr 84px}
.c-ppl{grid-template-columns:minmax(150px,1.4fr) 1.2fr 1.4fr .7fr .7fr 84px}
.c-mem{grid-template-columns:minmax(180px,2fr) 150px 270px}
.c-pol{grid-template-columns:minmax(160px,1.4fr) minmax(180px,1.7fr) 120px 130px 110px 130px}
.c-hist{grid-template-columns:110px 130px minmax(200px,2fr) minmax(160px,1.5fr)}
.c-sres{grid-template-columns:minmax(180px,2fr) 1.2fr}
.c-shold{grid-template-columns:minmax(150px,1.5fr) 1.6fr 1fr 1fr}
.c-trn{grid-template-columns:minmax(170px,1.5fr) .9fr .9fr 1fr 1fr minmax(170px,1.6fr) 120px}
.c-tpol{grid-template-columns:minmax(180px,1.4fr) 170px minmax(220px,2fr) 120px}
.blk{display:block}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;overflow-wrap:anywhere}
.small{font-size:12px;color:#555}
.right{text-align:right}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:2px;padding:14px 16px;text-align:left;border:1px solid #CCC;background:#fff;font:inherit;color:inherit;cursor:pointer}
.tile:hover{border-color:#777}
.tile .n{font-size:28px;font-weight:700;line-height:1.1}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column}
.g4{gap:4px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}.g20{gap:20px}.g24{gap:24px}
.cols{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.colMain{flex:999 1 520px;min-width:0}
.colSide{flex:1 1 300px;min-width:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid #CCC;flex-wrap:wrap}
.tab{border:0;background:none;padding:10px 14px;font:inherit;color:#555;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;min-height:42px}
.tab.on{color:#111;font-weight:600;border-bottom-color:#111}
.cnt{display:inline-block;min-width:20px;padding:0 6px;background:#E6E6E6;font-size:12px;margin-left:6px;color:#333;font-weight:600}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:1px solid #777;background:#fff;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer;min-height:34px;color:inherit}
.fchip:hover{background:#EEE}
.fchip.on{background:#111;border-color:#111;color:#fff}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:13px}
.inp{min-height:38px;padding:0 10px;border:1px solid #888;font:inherit;font-weight:400;background:#fff;color:inherit;width:100%}
textarea.inp{min-height:84px;padding:8px 10px;resize:vertical}
.hint{font-weight:400;color:#555;font-size:12px}
.err{color:#111;font-size:12px;font-weight:600}
.errbox{border:1px dashed #111;background:#fff;padding:10px 14px}
.errbox ul{margin:6px 0 0;padding-left:18px}
.callout{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;background:#fff;border:1px solid #999}
.callout.warnbox{border:1px dashed #111}
.alertrow{display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:space-between;align-items:center;padding:10px 18px;border-top:1px solid #E4E4E4}
.affh{display:flex;flex-wrap:wrap;gap:10px 28px;justify-content:space-between;align-items:flex-start;padding:14px 18px;border-bottom:1px solid #E4E4E4;background:#F7F7F7}
.affmeta{display:flex;flex-wrap:wrap;gap:6px 24px;margin:0}
.affmeta div{display:flex;flex-direction:column}
.affmeta dt{font-size:12px;color:#555}
.affmeta dd{margin:0;font-weight:500}
.afff{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding:10px 18px;border-top:1px solid #E4E4E4}
.kv{margin:0;display:flex;flex-direction:column}
.kvr{display:grid;grid-template-columns:170px 1fr;gap:12px;padding:7px 0;border-bottom:1px solid #EEE}
.kvr:last-child{border-bottom:0}
.kvr dt{color:#555}
.kvr dd{margin:0;overflow-wrap:anywhere}
.steps{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.stp{display:flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid #CCC;background:#fff;font:inherit;color:#555}
.stp .num{width:22px;height:22px;display:grid;place-items:center;font-size:12px;font-weight:700;border:1px solid #888}
.stp.cur{border-color:#111;color:#111;font-weight:600}
.stp.cur .num{background:#111;border-color:#111;color:#fff}
.stp.done{color:#111;cursor:pointer}
.stp.done .num{background:#555;border-color:#555;color:#fff}
.stp:disabled{opacity:1;cursor:default}
.opt{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px 16px;border:1px solid #AAA;background:#fff;font:inherit;color:inherit;cursor:pointer;width:100%}
.opt:hover{border-color:#555}
.opt.on{border-color:#111;box-shadow:inset 0 0 0 1px #111;background:#EAEAEA}
.opt-s{padding:10px 14px}
.optrow{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:10px 14px;border:1px solid #AAA;background:#fff;font:inherit;color:inherit;cursor:pointer;width:100%}
.optrow:hover{border-color:#555}
.optrow.on{border-color:#111;background:#EAEAEA}
.chk{display:inline-grid;place-items:center;width:18px;height:18px;border:1.5px solid #111;flex:none;font-size:12px;line-height:1;font-weight:700;background:#fff;margin-top:1px;padding:0;color:#111;cursor:pointer}
.chk.on{background:#111;color:#fff}
.meta{font-size:12px;color:#555}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
legend{font-weight:600;font-size:13px;padding:0;margin-bottom:6px}
.req{font-weight:400;color:#555;font-size:12px}
.checks{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pstep{display:flex;gap:12px;padding:8px 0}
.dot{width:26px;height:26px;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;border:2px solid #AAA;background:#fff;color:#555}
.dot.Approved{background:#111;border-color:#111;color:#fff}
.dot.Waiting{border-color:#111;border-style:dashed;color:#111}
.dot.Denied{border:3px double #111;color:#111}
.msgs{display:flex;flex-direction:column;gap:10px;max-height:440px;overflow:auto;padding:2px}
.msg{padding:10px 12px;background:#EEE;max-width:94%}
.msg.mine{background:#DDD;align-self:flex-end}
.msg p{margin:6px 0 0}
.tlink{color:#111;font-weight:600;text-decoration:underline;text-underline-offset:2px}
.tlink:hover{text-decoration-thickness:2px}
.selbar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:calc(100vw - 32px)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60}
.dlg{position:fixed;z-index:61;top:4vh;left:50%;transform:translateX(-50%);width:min(1120px,calc(100vw - 32px));max-height:92vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.hmwrap{overflow-x:auto;padding:6px}
.hmgrid{display:grid;grid-template-columns:repeat(8,minmax(66px,1fr));grid-template-rows:repeat(5,76px);gap:8px;min-width:600px}
.hm{border:1px solid #888;background:#fff;color:#111;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:6px 8px;position:relative;text-align:left;min-width:0}
.hm0{border-style:dotted;color:#666}.hm1{background:#E6E6E6}.hm2{background:#BDBDBD}.hm3{background:#7D7D7D;color:#fff}.hm4{background:#333;color:#fff}
.hm.out{outline:3px dashed #111;outline-offset:2px}
.hm.on{box-shadow:0 0 0 3px #fff,0 0 0 6px #111}
.hmcode{font-weight:700;font-size:13px}.hmname{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.hmnum{font-size:12px;font-weight:600}
.hmflag{position:absolute;top:4px;right:5px;font-weight:800;background:#fff;color:#111;border:1px solid #111;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:12px}
.p-SEA{grid-column:1;grid-row:1}.p-MSP{grid-column:4;grid-row:1}.p-CHI{grid-column:5;grid-row:1}.p-BOS{grid-column:8;grid-row:1}
.p-DEN{grid-column:2;grid-row:2}.p-KC{grid-column:4;grid-row:2}.p-COL{grid-column:6;grid-row:2}.p-DC{grid-column:7;grid-row:2}
.p-PHX{grid-column:2;grid-row:3}.p-RIC{grid-column:6;grid-row:3}.p-ARL{grid-column:7;grid-row:3}
.p-AUS{grid-column:3;grid-row:4}.p-ATL{grid-column:5;grid-row:4}.p-RAL{grid-column:6;grid-row:4}.p-TPA{grid-column:6;grid-row:5}
.legend{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:12px}
.sw{display:inline-block;width:16px;height:16px;border:1px solid #888;vertical-align:middle;margin-right:4px}
.sw.out{outline:2px dashed #111;outline-offset:1px;background:#fff}
.c-hm{grid-template-columns:minmax(130px,1.3fr) 80px 64px minmax(110px,1fr) minmax(140px,1.4fr)}
.hmp{border:1px solid #CCC;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.hmp.flag{border:1px dashed #111}
.dateRow{display:flex;flex-wrap:wrap;gap:12px}
.dateRow .f{flex:1 1 180px}
.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw}
.empty{padding:24px 18px;text-align:center;color:#555;margin:0}
.bulk{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;background:#111;color:#fff}
.bulk .inp{max-width:340px;min-height:32px}
.lbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;width:100%;border:0;border-bottom:1px solid #E4E4E4;background:#fff;padding:11px 14px;font:inherit;color:inherit;cursor:pointer}
.lbtn:last-child{border-bottom:0}
.lbtn:hover{background:#F4F4F4}
.lbtn.on{background:#EAEAEA;box-shadow:inset 3px 0 0 #111}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:0;padding:0;list-style:none}
.how li{display:flex;gap:10px;align-items:flex-start}
.hn{width:26px;height:26px;background:#111;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.tog{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #E4E4E4}
.tog input{width:18px;height:18px;margin-top:2px;flex:none}
.cbx{display:flex;gap:8px;align-items:center;font-weight:500}
.cbx input{width:18px;height:18px}
.grow{flex:1 1 260px}
.navrow{border-top:1px solid #E4E4E4;padding-top:14px}
.ai{display:flex;flex-direction:column;gap:2px;min-width:0}
.aibar{display:block;width:100%;height:6px;background:#DDD}
.aibar span{display:block;height:100%;background:#111}
.aibig{font-size:28px;font-weight:700;line-height:1}
.cmpcol{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:6px}
.cmpitem{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid #DDD;background:#fff}
.picklist{max-height:300px;overflow:auto;border:1px solid #CCC;display:flex;flex-direction:column}
.picklist .optrow{border:0;border-bottom:1px solid #E4E4E4}
@media (max-width:820px){
.main{padding:16px}
.side{flex-direction:row;flex-wrap:wrap;max-width:none;flex-basis:100%;padding:8px 12px;gap:4px;background:#fff;border-bottom:1px solid #CCC}
.navb{width:auto;min-height:36px}
.navb.on{box-shadow:inset 0 -2px 0 #111,0 0 0 1px #CCC}
.sidehelp{display:none}
.who .nm{display:none}
.kvr{grid-template-columns:1fr;gap:2px}
}
</style>
<style>sc-if,sc-for{display:contents}</style>
</head>
<body>
<div id="app"></div>
<template id="dc-template">
<div class="app">
<header class="top">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><rect x="4" y="11" width="16" height="10"></rect><path d="M8 11V7a4 4 0 0 1 7.6-1.7"></path></svg>
    <span>Unlocked</span>
  </div>
  <div class="search" onBlur="{{onQBlur}}">
    <label for="gsearch" class="vh">Search or jump to access, people, slots, requests and pages</label>
    <svg class="sicon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
    <input id="gsearch" class="sinp" type="search" autocomplete="off" placeholder="Search or jump to… an app, repo, dataset, person, or REQ-1042" value="{{q}}" onChange="{{onQ}}" onFocus="{{onQFocus}}" onKeyDown="{{onQKey}}">
    <sc-if value="{{showQ}}" hint-placeholder-val="{{false}}">
      <div class="sres">
        <sc-for list="{{qResults}}" as="r" hint-placeholder-count="3">
          <button type="button" class="sitem" onClick="{{r.go}}"><span class="kind">{{r.kind}}</span><span class="stack"><span>{{r.label}}</span><span class="small">{{r.sub}}</span></span></button>
        </sc-for>
        <sc-if value="{{qNone}}" hint-placeholder-val="{{false}}"><p class="small" style="margin: 8px 10px">No matches. Try an app, a repo, a person, a page, or a request ID like REQ-1042.</p></sc-if>
      </div>
    </sc-if>
  </div>
  <div class="who" onBlur="{{onMenuBlur}}" onKeyDown="{{onMenuKey}}">
    <button type="button" id="whob" class="whob" aria-haspopup="menu" aria-expanded="{{menuOpen}}" aria-controls="rolemenu" onClick="{{toggleMenu}}"><span class="av" aria-hidden="true">{{meInit}}</span><span class="nm stack"><strong>{{meName}}</strong><span class="small">{{meTitle}} · {{roleName}} view</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
    <sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
      <div class="umenu" id="rolemenu" role="menu" aria-label="Prototype: view as">
        <div class="mhead">Prototype: view as</div>
        <sc-for list="{{roleBtns}}" as="b" hint-placeholder-count="3"><button type="button" role="menuitemradio" aria-checked="{{b.on}}" class="{{b.cls}}" onClick="{{b.pick}}"><span class="stack"><strong>{{b.label}}</strong><span class="small">{{b.who}}</span></span><sc-if value="{{b.on}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if></button></sc-for>
      </div>
    </sc-if>
  </div>
</header>

<div class="shell">
  <nav class="side" aria-label="Main">
    <sc-for list="{{navItems}}" as="n" hint-placeholder-count="7">
      <button type="button" class="{{n.cls}}" aria-current="{{n.cur}}" onClick="{{n.go}}"><span>{{n.label}}</span><sc-if value="{{n.hasBadge}}" hint-placeholder-val="{{false}}"><span class="badge">{{n.badge}}</span></sc-if></button>
    </sc-for>
    <div class="sidehelp">
      <strong>Not sure what to ask for?</strong>
      <span>The guide explains every type of access and who approves it.</span>
      <button type="button" class="link" onClick="{{toGuide}}">Open the access guide</button>
    </div>
  </nav>

  <main class="main">
  <div class="wrap">

  <!-- ============ MY ACCESS ============ -->
  <sc-if value="{{isDash}}" hint-placeholder-val="{{true}}">
  <div class="stack g24">
    <div class="row between">
      <div><h1>{{greet}}</h1><p class="sub">Your access, grouped by the slot it belongs to.</p></div>
      <div class="row g8"><button type="button" class="btn" onClick="{{toCompare}}">Compare with someone</button><button type="button" class="btn pri" onClick="{{newRequest}}">+ Request access</button></div>
    </div>
    <div class="tabs" role="tablist" aria-label="My access views"><sc-for list="{{dashTabs}}" as="t" hint-placeholder-count="2"><button type="button" role="tab" class="{{t.cls}}" aria-selected="{{t.on}}" onClick="{{t.pick}}">{{t.label}}</button></sc-for></div>
    <sc-if value="{{dashCurrent}}" hint-placeholder-val="{{true}}">
    <sc-if value="{{hasAlerts}}" hint-placeholder-val="{{true}}">
      <section class="card" aria-labelledby="needs-h">
        <div class="pad" style="padding-bottom: 10px"><h2 id="needs-h">Needs your attention</h2></div>
        <sc-for list="{{alerts}}" as="a" hint-placeholder-count="2">
          <div class="alertrow"><div class="row g8"><span class="{{a.cls}}">{{a.tag}}</span><span>{{a.text}}</span></div><button type="button" class="btn sm" onClick="{{a.act}}">{{a.btn}}</button></div>
        </sc-for>
      </section>
    </sc-if>
    <div class="tiles">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
        <button type="button" class="tile" onClick="{{t.go}}"><span class="n">{{t.n}}</span><strong>{{t.label}}</strong><span class="small">{{t.sub}}</span></button>
      </sc-for>
    </div>
    <div class="row between">
      <div class="fchips" role="group" aria-label="Filter access">
        <sc-for list="{{dashFilters}}" as="f" hint-placeholder-count="5"><button type="button" class="{{f.cls}}" aria-pressed="{{f.on}}" onClick="{{f.pick}}">{{f.label}}</button></sc-for>
      </div>
      <span class="small">{{dashCountTxt}}</span>
    </div>
    <sc-for list="{{myAffs}}" as="af" hint-placeholder-count="2">
      <section class="card">
        <div class="affh">
          <div>
            <div class="row g8"><span class="small">{{af.kindLbl}}</span><sc-if value="{{af.primary}}" hint-placeholder-val="{{true}}"><span class="chip mute">Primary</span></sc-if></div>
            <h2 style="margin-top: 2px">{{af.role}}</h2>
            <p class="sub">{{af.subLbl}}</p>
          </div>
          <sc-if value="{{af.isSlot}}" hint-placeholder-val="{{true}}"><dl class="affmeta">
            <div><dt>Supervisor</dt><dd>{{af.sup}}</dd></div>
            <div><dt>Filled since</dt><dd>{{af.since}}</dd></div>
            <div><dt>Slot ends</dt><dd>{{af.ends}}<span class="small blk">{{af.endsHint}}</span></dd></div>
          </dl></sc-if>
        </div>
        <div class="tbl">
          <div class="dt" role="table" aria-label="Access in the {{af.role}} slot">
            <div class="tr th c-acc" role="row"><span role="columnheader">Access</span><span role="columnheader">Type of access</span><span role="columnheader">Source</span><span role="columnheader">Status</span><span role="columnheader">Granted</span><span role="columnheader">Expires</span><span role="columnheader" class="vh">Action</span></div>
            <sc-for list="{{af.rows}}" as="x" hint-placeholder-count="3">
              <div class="tr c-acc" role="row">
                <span role="cell"><strong>{{x.name}}</strong><span class="mono small blk">{{x.path}}</span></span>
                <span role="cell">{{x.typeName}}</span>
                <span role="cell">{{x.src}}</span>
                <span role="cell"><span class="{{x.cls}}">{{x.status}}</span></span>
                <span role="cell">{{x.granted}}</span>
                <span role="cell">{{x.expires}}<span class="small blk">{{x.hint}}</span></span>
                <span role="cell" class="right"><button type="button" class="btn sm" onClick="{{x.act}}">{{x.actLabel}}</button></span>
              </div>
            </sc-for>
            <sc-if value="{{af.none}}" hint-placeholder-val="{{false}}"><p class="empty">Nothing in this slot matches the current filter.</p></sc-if>
          </div>
        </div>
        <div class="afff"><span class="small">{{af.countTxt}}</span><div class="row g12"><sc-if value="{{af.canExtend}}" hint-placeholder-val="{{false}}"><button type="button" class="link" onClick="{{af.extend}}">{{af.extendLabel}}</button></sc-if><button type="button" class="link" onClick="{{af.request}}">{{af.reqLbl}}</button></div></div>
      </section>
    </sc-for>
    </sc-if>
  </div>
  </sc-if>

  <!-- ============ MY REQUESTS ============ -->
  <sc-if value="{{isMyReqs}}" hint-placeholder-val="{{false}}">
  <div class="stack g20">
    <div class="row between">
      <div><h1>My requests</h1><p class="sub">Requests you made, requests made for you, and ones you made on someone’s behalf.</p></div>
      <button type="button" class="btn pri" onClick="{{newRequest}}">+ Request access</button>
    </div>
    <div class="tabs" role="tablist" aria-label="Request filter">
      <sc-for list="{{reqTabs}}" as="t" hint-placeholder-count="2"><button type="button" role="tab" class="{{t.cls}}" aria-selected="{{t.on}}" onClick="{{t.pick}}">{{t.label}}<span class="cnt">{{t.n}}</span></button></sc-for>
    </div>
    <sc-if value="{{reqShowBulk}}" hint-placeholder-val="{{false}}">
      <div class="bulk" role="region" aria-label="Bulk actions"><strong>{{reqBulkN}} selected</strong><button type="button" class="btn sm inv" onClick="{{reqBulkEsc}}">Escalate</button><button type="button" class="btn sm inv" onClick="{{reqBulkWithdraw}}">Withdraw</button><label class="vh" for="rbr">Escalation reason</label><input id="rbr" class="inp" placeholder="Reason for escalating (optional)" value="{{reqBulkReason}}" onChange="{{onReqBulkReason}}"><button type="button" class="btn sm invg" onClick="{{reqClearSel}}">Clear</button></div>
    </sc-if>
    <div class="card tbl">
      <div class="dt" role="table" aria-label="My requests">
        <div class="tr th c-req" role="row"><span role="columnheader"><span class="vh">Select</span></span><span role="columnheader">Request</span><span role="columnheader">Access or slot</span><span role="columnheader">For</span><span role="columnheader">Submitted</span><span role="columnheader">Status</span><span role="columnheader">Where it is now</span><span role="columnheader" class="vh">Action</span></div>
        <sc-for list="{{myReqRows}}" as="r" hint-placeholder-count="3">
          <div class="{{r.rowCls}}" role="row">
            <span role="cell"><sc-if value="{{r.canCheck}}" hint-placeholder-val="{{true}}"><input type="checkbox" aria-label="Select {{r.id}}" checked="{{r.checked}}" onChange="{{r.toggle}}"></sc-if></span>
            <span role="cell" class="mono">{{r.id}}</span>
            <span role="cell"><strong>{{r.res}}</strong><span class="small blk">{{r.type}}</span></span>
            <span role="cell">{{r.forTxt}}</span>
            <span role="cell">{{r.submitted}}</span>
            <span role="cell" class="stack g4" style="align-items: flex-start"><span class="{{r.cls}}">{{r.status}}</span><sc-if value="{{r.escalated}}" hint-placeholder-val="{{false}}"><span class="chip warn">Escalated</span></sc-if></span>
            <span role="cell">{{r.where}}<span class="small blk">{{r.who}}</span></span>
            <span role="cell" class="right"><button type="button" class="btn sm" onClick="{{r.open}}">{{r.btn}}</button></span>
          </div>
        </sc-for>
        <sc-if value="{{myReqEmpty}}" hint-placeholder-val="{{false}}"><p class="empty">No requests here yet.</p></sc-if>
      </div>
    </div>
  </div>
  </sc-if>

  <!-- ============ MY ACCESS › HISTORY ============ -->
  <sc-if value="{{isHist}}" hint-placeholder-val="{{false}}">
  <div class="stack g20" style="margin-top: 24px">
    <p class="sub" style="margin: 0">Everything you’ve had, requested, and lost, newest first.</p>
    <div class="tiles">
      <sc-for list="{{histTiles}}" as="t" hint-placeholder-count="4"><div class="card pad"><span class="aibig">{{t.n}}</span><span class="small blk">{{t.label}}</span></div></sc-for>
    </div>
    <div class="fchips" role="group" aria-label="Filter history"><sc-for list="{{histFilters}}" as="f" hint-placeholder-count="5"><button type="button" class="{{f.cls}}" aria-pressed="{{f.on}}" onClick="{{f.pick}}">{{f.label}}</button></sc-for></div>
    <div class="card tbl">
      <div class="dt" role="table" aria-label="Access history">
        <div class="tr th c-hist" role="row"><span role="columnheader">Date</span><span role="columnheader">Event</span><span role="columnheader">What</span><span role="columnheader">Details</span></div>
        <sc-for list="{{histRows}}" as="h" hint-placeholder-count="6"><div class="tr c-hist" role="row"><span role="cell">{{h.date}}</span><span role="cell"><span class="{{h.cls}}">{{h.kind}}</span></span><span role="cell"><strong>{{h.text}}</strong></span><span role="cell" class="small">{{h.detail}}</span></div></sc-for>
        <sc-if value="{{histEmpty}}" hint-placeholder-val="{{false}}"><p class="empty">Nothing in this view.</p></sc-if>
      </div>
    </div>
  </div>
  </sc-if>

  <!-- ============ MY ACCESS › TRAININGS ============ -->
  <sc-if value="{{isTrain}}" hint-placeholder-val="{{false}}">
  <div class="stack g20" style="margin-top: 24px">
    <p class="sub" style="margin: 0">Some access requires training, and some training has to be retaken every year or two to keep that access.</p>
    <sc-if value="{{trGapHas}}" hint-placeholder-val="{{false}}"><div class="callout warnbox" role="status"><span><strong>{{trGapHead}}</strong> {{trGapTxt}}</span></div></sc-if>
    <div class="card tbl">
      <div class="dt" role="table" aria-label="My trainings" style="min-width: 900px">
        <div class="tr th c-trn" role="row"><span role="columnheader">Course</span><span role="columnheader">Retake</span><span role="columnheader">Completed</span><span role="columnheader">Valid until</span><span role="columnheader">Status</span><span role="columnheader">Needed for</span><span role="columnheader" class="vh">Action</span></div>
        <sc-for list="{{trRows}}" as="t" hint-placeholder-count="5"><div class="tr c-trn" role="row"><span role="cell"><a class="tlink" href="{{t.href}}" target="_blank" rel="noopener" onClick="{{t.go}}">{{t.name}} ↗</a></span><span role="cell">{{t.renews}}</span><span role="cell">{{t.done}}</span><span role="cell">{{t.until}}<span class="small blk">{{t.hint}}</span></span><span role="cell"><span class="{{t.cls}}">{{t.status}}</span></span><span role="cell" class="small">{{t.needed}}</span><span role="cell" class="right"><button type="button" class="btn sm" onClick="{{t.take}}">{{t.btn}}</button></span></div></sc-for>
      </div>
    </div>
  </div>
  </sc-if>

  <!-- ============ REQUEST DETAIL ============ -->
  <sc-if value="{{isDetail}}" hint-placeholder-val="{{false}}">
  <div class="stack g20">
    <div><button type="button" class="link" onClick="{{backDetail}}">← Back to {{backLabel}}</button></div>
    <div class="row between" style="align-items: flex-start">
      <div>
        <div class="row g8"><span class="mono">{{d.id}}</span><span class="{{d.cls}}">{{d.status}}</span><sc-if value="{{d.isSlot}}" hint-placeholder-val="{{false}}"><span class="chip mute">Slot assignment</span></sc-if><sc-if value="{{d.renew}}" hint-placeholder-val="{{false}}"><span class="chip mute">Renewal</span></sc-if></div>
        <h1 style="margin-top: 6px">{{d.res}}</h1>
        <p class="sub">{{d.subline}}</p>
      </div>
      <div class="row g8">
        <sc-if value="{{d.canEscalate}}" hint-placeholder-val="{{false}}"><button type="button" class="btn" aria-expanded="{{escOpen}}" onClick="{{toggleEsc}}">Escalate</button></sc-if>
        <sc-if value="{{d.canWithdraw}}" hint-placeholder-val="{{false}}"><button type="button" class="btn danger" onClick="{{withdraw}}">Withdraw request</button></sc-if>
      </div>
    </div>
    <sc-if value="{{escOpen}}" hint-placeholder-val="{{false}}">
      <section class="card pad stack g8" aria-labelledby="esc-h">
        <h2 id="esc-h">Escalate to {{d.escToName}}</h2>
        <p class="small" style="margin: 0">They’ll be able to decide on it right away. Say why it can’t wait.</p>
        <label class="f" for="escr">Reason <span class="req">· required</span><textarea id="escr" class="inp" value="{{escReason}}" onChange="{{onEscReason}}"></textarea></label>
        <div class="row g8"><button type="button" class="btn pri" onClick="{{doEscalate}}">Escalate</button><button type="button" class="btn ghost" onClick="{{toggleEsc}}">Cancel</button></div>
      </section>
    </sc-if>
    <sc-if value="{{d.hasEsc}}" hint-placeholder-val="{{false}}"><div class="callout warnbox" role="status"><span><strong>{{d.escHead}}</strong> {{d.escTxt}}</span></div></sc-if>
    <sc-if value="{{d.infoReq}}" hint-placeholder-val="{{false}}">
      <div class="callout warnbox" role="status"><span><strong>The approver has a question.</strong> Reply in the conversation. The request moves forward as soon as you answer.</span></div>
    </sc-if>
    <sc-if value="{{d.canDecide}}" hint-placeholder-val="{{false}}">
      <section class="card pad stack g12" aria-labelledby="dec-h" style="border: 2px solid #111">
        <div class="row between"><h2 id="dec-h">Your decision · {{d.stepLabel}}</h2><sc-if value="{{d.needAssign}}" hint-placeholder-val="{{false}}"><button type="button" class="btn sm" onClick="{{assignMe}}">Assign to me</button></sc-if></div>
        <p class="small" style="margin: 0">{{d.guideTxt}}</p>
        <label class="f" for="note">Note to requester <span class="hint">Required to deny or ask a question. Optional when approving.</span><textarea id="note" class="inp" value="{{note}}" onChange="{{onNote}}"></textarea></label>
        <sc-if value="{{noteErr}}" hint-placeholder-val="{{false}}"><span class="err" role="alert">Add a note so the requester knows what to do next.</span></sc-if>
        <div class="row g8"><button type="button" class="btn pri" onClick="{{approve}}">{{d.approveLabel}}</button><button type="button" class="btn" onClick="{{askInfo}}">Ask a question</button><button type="button" class="btn danger" onClick="{{deny}}">Deny</button></div>
      </section>
    </sc-if>
    <div class="cols">
      <div class="colMain stack g16">
        <sc-if value="{{d.showAI}}" hint-placeholder-val="{{false}}">
          <section class="card pad stack g12" aria-labelledby="ai-h">
            <div class="row between"><h2 id="ai-h">AI confidence</h2><span class="small">Suggestion only. Based on access patterns of similar people.</span></div>
            <div class="row g16" style="align-items: flex-start">
              <div class="ai" style="width: 160px"><span class="aibig">{{d.ai.score}}</span><span>{{d.ai.label}} confidence</span><span class="aibar" aria-hidden="true"><span style="width: {{d.ai.pct}}"></span></span></div>
              <ul class="checks" style="flex: 1 1 280px"><sc-for list="{{d.ai.reasons}}" as="x" hint-placeholder-count="3"><li>{{x.t}}</li></sc-for></ul>
            </div>
          </section>
        </sc-if>
        <section class="card pad stack g8">
          <h2>Request details</h2>
          <dl class="kv"><sc-for list="{{d.kv}}" as="r" hint-placeholder-count="6"><div class="kvr"><dt>{{r.k}}</dt><dd>{{r.v}}</dd></div></sc-for></dl>
        </section>
        <section class="card pad stack g8">
          <h2>Approval path</h2>
          <ol class="path"><sc-for list="{{d.steps}}" as="s" hint-placeholder-count="2"><li class="pstep"><span class="{{s.dot}}">{{s.n}}</span><span class="stack"><strong>{{s.label}}</strong><span>{{s.who}}</span><span class="small">{{s.when}}</span></span></li></sc-for></ol>
        </section>
        <sc-if value="{{d.showReqView}}" hint-placeholder-val="{{false}}">
          <section class="card">
            <div class="pad" style="padding-bottom: 8px"><h2>What {{d.reqFirst}} already has</h2><p class="sub">Their current access across all slots, for context.</p></div>
            <div class="tbl"><div class="dt" role="table" aria-label="Requester’s current access" style="min-width: 520px">
              <div class="tr th" role="row" style="grid-template-columns: minmax(180px,2fr) 1.3fr 1.2fr 1fr"><span role="columnheader">Access</span><span role="columnheader">Type of access</span><span role="columnheader">Slot</span><span role="columnheader">Status</span></div>
              <sc-for list="{{d.reqAccess}}" as="a" hint-placeholder-count="3"><div class="tr" role="row" style="grid-template-columns: minmax(180px,2fr) 1.3fr 1.2fr 1fr"><span role="cell">{{a.name}}</span><span role="cell">{{a.type}}</span><span role="cell">{{a.slot}}</span><span role="cell"><span class="{{a.cls}}">{{a.status}}</span></span></div></sc-for>
            </div></div>
          </section>
        </sc-if>
      </div>
      <section class="colSide card pad stack g12" aria-labelledby="conv-h">
        <h2 id="conv-h">Conversation</h2>
        <div class="msgs" aria-live="polite">
          <sc-for list="{{d.msgs}}" as="m" hint-placeholder-count="2"><div class="{{m.cls}}"><div class="row between small"><strong style="color: #111">{{m.from}}</strong><span>{{m.at}}</span></div><span class="small">{{m.role}}</span><p>{{m.text}}</p></div></sc-for>
          <sc-if value="{{d.noMsgs}}" hint-placeholder-val="{{false}}"><p class="small" style="margin: 0">No messages yet. Everyone on the approval path can see what you write here.</p></sc-if>
        </div>
        <label class="f" for="msg">Message<textarea id="msg" class="inp" placeholder="Write a message…" value="{{msg}}" onChange="{{onMsg}}"></textarea></label>
        <div><button type="button" class="btn" onClick="{{sendMsg}}">Send message</button></div>
      </section>
    </div>
  </div>
  </sc-if>

  <!-- ============ APPROVALS ============ -->
  <sc-if value="{{isAp}}" hint-placeholder-val="{{false}}">
  <div class="stack g20">
    <div><h1>Approvals</h1><p class="sub">Requests waiting on you and your team, oldest first. Items pass to the next level up once they wait longer than the typical time.</p></div>
    <div class="tabs" role="tablist" aria-label="Approval queues">
      <sc-for list="{{apTabs}}" as="t" hint-placeholder-count="4"><button type="button" role="tab" class="{{t.cls}}" aria-selected="{{t.on}}" onClick="{{t.pick}}">{{t.label}}<span class="cnt">{{t.n}}</span></button></sc-for>
    </div>
    <div class="fchips" role="group" aria-label="Filter by type of access">
      <sc-for list="{{apTypeChips}}" as="c" hint-placeholder-count="3"><button type="button" class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for>
    </div>
    <sc-if value="{{showBulk}}" hint-placeholder-val="{{false}}">
      <div class="bulk" role="region" aria-label="Bulk actions"><strong>{{bulkN}} selected</strong><button type="button" class="btn sm inv" onClick="{{bulkApprove}}">Approve</button><button type="button" class="btn sm inv" onClick="{{bulkDeny}}">Deny</button><label class="vh" for="apn">Note to requesters</label><input id="apn" class="inp" placeholder="Note to requesters (required to deny)" value="{{apNote}}" onChange="{{onApNote}}"><button type="button" class="btn sm invg" onClick="{{clearSel}}">Clear</button><sc-if value="{{apNoteErr}}" hint-placeholder-val="{{false}}"><span role="alert">Add a note before denying.</span></sc-if></div>
    </sc-if>
    <div class="card tbl">
      <div class="dt" role="table" aria-label="Approval requests" style="min-width: 960px">
        <div class="tr th c-ap" role="row"><span role="columnheader"><span class="vh">Select</span></span><span role="columnheader">Request</span><span role="columnheader">Requester</span><span role="columnheader">Access or slot</span><span role="columnheader">{{apStepHead}}</span><span role="columnheader">{{apWaitHead}}</span><span role="columnheader">AI confidence</span><span role="columnheader" class="vh">Action</span></div>
        <sc-for list="{{apRows}}" as="r" hint-placeholder-count="4">
          <div class="{{r.rowCls}}" role="row">
            <span role="cell"><sc-if value="{{r.canCheck}}" hint-placeholder-val="{{true}}"><input type="checkbox" aria-label="Select {{r.id}}" checked="{{r.checked}}" onChange="{{r.toggle}}"></sc-if></span>
            <span role="cell" class="mono">{{r.id}}</span>
            <span role="cell"><strong>{{r.reqName}}</strong><span class="small blk">{{r.reqSub}}</span></span>
            <span role="cell">{{r.res}}<span class="small blk">{{r.type}}</span></span>
            <span role="cell">{{r.stepTxt}}<span class="small blk">{{r.assignTxt}}</span></span>
            <span role="cell" class="stack g4" style="align-items: flex-start"><span class="{{r.waitCls}}">{{r.waitTxt}}</span><sc-if value="{{r.escalated}}" hint-placeholder-val="{{false}}"><span class="small">{{r.escTxt}}</span></sc-if></span>
            <span role="cell" class="ai"><span><strong>{{r.aiScore}}</strong> · {{r.aiLabel}}</span><span class="aibar" aria-hidden="true"><span style="width: {{r.aiPct}}"></span></span><span class="small">{{r.aiWhy}}</span></span>
            <span role="cell" class="right"><button type="button" class="btn sm" onClick="{{r.open}}">{{r.btn}}</button></span>
          </div>
        </sc-for>
        <sc-if value="{{apEmpty}}" hint-placeholder-val="{{false}}"><p class="empty">{{apEmptyTxt}}</p></sc-if>
      </div>
    </div>
  </div>
  </sc-if>

  <!-- ============ MY TEAM (ADMIN) HEADER ============ -->
  <sc-if value="{{isAdmin}}" hint-placeholder-val="{{false}}">
    <div class="stack g20" style="margin-bottom: 20px">
      <div><h1>My team</h1><p class="sub">Your team is the {{myOfficeName}} office. Manage who approves, the slots your office fills, and the rules access follows.</p></div>
      <div class="tabs" role="tablist" aria-label="Team sections">
        <sc-for list="{{adminTabs}}" as="t" hint-placeholder-count="4"><button type="button" role="tab" class="{{t.cls}}" aria-selected="{{t.on}}" onClick="{{t.pick}}">{{t.label}}</button></sc-for>
      </div>
    </div>
  </sc-if>

  <!-- ============ MY TEAM › SLOTS ============ -->
  <sc-if value="{{isSlotsTab}}" hint-placeholder-val="{{false}}">
  <div class="stack g20">
    <div class="row between">
      <div><h2 style="font-size: 18px">Slots</h2><p class="sub">A slot is a Job/Role at an office, bundled with the access that job needs. Only admins fill slots, and you can create and fill slots for the {{myOfficeName}} office only.</p></div>
      <button type="button" class="btn pri" onClick="{{newSlot}}">+ New slot</button>
    </div>
    <div class="fchips" role="group" aria-label="Which slots"><sc-for list="{{slotScopes}}" as="c" hint-placeholder-count="2"><button type="button" class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for></div>
    <div class="cols">
      <nav class="card" style="flex: 1 1 260px; max-width: 340px; overflow: hidden" aria-label="Slots">
        <sc-for list="{{slotItems}}" as="s" hint-placeholder-count="4"><button type="button" class="{{s.cls}}" aria-current="{{s.cur}}" onClick="{{s.pick}}"><strong>{{s.role}}</strong><span class="small">{{s.office}} office</span><span class="small">{{s.meta}}</span></button></sc-for>
      </nav>

      <sc-if value="{{slotView}}" hint-placeholder-val="{{true}}">
        <section class="colMain card pad stack g16" aria-labelledby="sl-h">
          <div class="row between" style="align-items: flex-start">
            <div><span class="small">{{sv.office}} office</span><h2 id="sl-h" style="font-size: 20px">{{sv.role}}</h2><p class="sub">{{sv.desc}}</p></div>
            <div class="row g8">

      <sc-if value="{{slotFill}}" hint-placeholder-val="{{false}}">

            <sc-if value="{{sf.hasHand}}" hint-placeholder-val="{{false}}">
              <fieldset><legend>When should {{sf.fromFirst}}’s assignment end?</legend><div class="fchips"><sc-for list="{{sf.endOpts}}" as="o" hint-placeholder-count="4"><button type="button" class="{{o.cls}}" aria-pressed="{{o.on}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div><span class="hint">{{sf.overlapHint}}</span></fieldset>
              <sc-if value="{{sf.handGapHas}}" hint-placeholder-val="{{false}}"><div class="callout warnbox" role="alert"><span class="stack g4"><strong>{{sf.handGapHead}}</strong><sc-for list="{{sf.handGaps}}" as="g" hint-placeholder-count="2"><span>{{g.t}} <sc-if value="{{g.canInclude}}" hint-placeholder-val="{{false}}"><button type="button" class="link" onClick="{{g.include}}">Include it</button></sc-if></span></sc-for><span class="small">As their manager, you’ll see an alert on My access until these are resolved.</span></span></div></sc-if>

          </sc-if>
          <fieldset><legend>Duration <span class="req">· required</span></legend><div class="fchips"><sc-for list="{{sf.durs}}" as="o" hint-placeholder-count="4"><button type="button" class="{{o.cls}}" aria-pressed="{{o.on}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div><span class="hint">{{sf.durHint}}</span></fieldset>
          <fieldset>
            <legend>Access for this person</legend>
            <span class="hint">All are included. Uncheck any this person doesn’t need. The slot itself doesn’t change.</span>

          </fieldset>
          <label class="f" for="sfj">Justification <span class="req">· required</span><textarea id="sfj" class="inp" value="{{sf.just}}" onChange="{{sf.onJust}}" placeholder="Why does this person need this slot?"></textarea></label>
          <div class="callout"><span><strong>{{sf.apHead}}</strong> {{sf.apTxt}}</span></div>
          <sc-if value="{{sf.showErr}}" hint-placeholder-val="{{false}}"><div class="errbox" role="alert"><strong>Before you continue:</strong><ul><sc-for list="{{sf.missing}}" as="m" hint-placeholder-count="1"><li>{{m.t}}</li></sc-for></ul></div></sc-if>

  </sc-if>

  <sc-if value="{{isDir}}" hint-placeholder-val="{{false}}">

  <!-- ============ ACCESS GUIDE ============ -->
  <sc-if value="{{isGuide}}" hint-placeholder-val="{{false}}">

    <div><h1>Access guide</h1><p class="sub">How access works here, and what each type of access needs.</p></div>
    <section class="card pad stack g12">
      <h2>How access works</h2>
      <ol class="how">
        <li><span class="hn">1</span><span><strong>Slots come first</strong><span class="small blk">Your admin puts you in a slot, a Job/Role at your office that bundles the access the job needs. One approval covers the whole bundle.</span></span></li>
        <li><span class="hn">2</span><span><strong>Ask for extras</strong><span class="small blk">Need something outside your slot? Request it, tied to the slot it supports.</span></span></li>
        <li><span class="hn">3</span><span><strong>Fill one standard form</strong><span class="small blk">Same fields every time for that type of access, always with a justification.</span></span></li>
        <li><span class="hn">4</span><span><strong>Track, reply, escalate</strong><span class="small blk">Follow each step, answer questions, and escalate if it’s stuck.</span></span></li>
      </ol>
    </section>
    <div class="cols">
      <nav class="card" style="flex: 1 1 240px; max-width: 320px; overflow: hidden" aria-label="Types of access">
        <sc-for list="{{gList}}" as="t" hint-placeholder-count="9"><button type="button" class="{{t.cls}}" aria-current="{{t.cur}}" onClick="{{t.pick}}"><strong>{{t.name}}</strong><span class="small">{{t.intent}}</span></button></sc-for>
      </nav>
      <section class="colMain card pad stack g16" aria-labelledby="g-h">
        <div class="row between" style="align-items: flex-start">
          <div><h2 id="g-h" style="font-size: 20px">{{g.name}}</h2><p class="sub">Use this when you need to: {{g.intentLow}}</p></div>
          <button type="button" class="btn pri" onClick="{{g.start}}">Start this request</button>
        </div>
        <p style="margin: 0">{{g.desc}}</p>
        <div class="tiles">
          <div class="card pad"><span class="small">Approvals</span><strong class="blk">{{g.stepsN}}</strong></div>
          <div class="card pad"><span class="small">Maximum duration</span><strong class="blk">{{g.max}}</strong></div>
          <div class="card pad"><span class="small">Typical turnaround</span><strong class="blk">{{g.turn}}</strong></div>
        </div>
        <div class="cols">
          <div class="colSide stack g8"><h3>You’ll need</h3><ul class="checks"><sc-for list="{{g.needs}}" as="n" hint-placeholder-count="3"><li>{{n.t}}</li></sc-for></ul></div>
          <div class="colSide stack g8"><h3>Who approves, in order</h3><ol class="path"><sc-for list="{{g.steps}}" as="s" hint-placeholder-count="2"><li class="pstep"><span class="dot">{{s.n}}</span><span class="stack"><strong>{{s.label}}</strong><span class="small">{{s.who}}</span></span></li></sc-for></ol></div>
        </div>
        <div class="stack g8"><h3>Examples in the directory</h3><ul class="checks"><sc-for list="{{g.examples}}" as="n" hint-placeholder-count="3"><li>{{n.t}}</li></sc-for></ul></div>
        <div class="stack g8"><h3>Tips</h3><ul class="checks"><sc-for list="{{g.tips}}" as="n" hint-placeholder-count="2"><li>{{n.t}}</li></sc-for></ul></div>
      </section>
    </div>
  </div>
  </sc-if>

  <!-- ============ LOOKUP & COMPARE ============ -->
  <sc-if value="{{isPeople}}" hint-placeholder-val="{{false}}">
  <div class="stack g20">
    <div><h1>Lookup &amp; compare</h1><p class="sub">Look anyone up, see their slots and access, and compare it with your own.</p></div>

      <label class="f grow" for="pq">Search people<input id="pq" class="inp" type="search" placeholder="Name or Job/Role" value="{{pQ}}" onChange="{{onPQ}}"></label>
      <label class="f" for="poff" style="min-width: 220px">Office
        <select id="poff" class="inp" value="{{pOffice}}" onChange="{{onPOffice}}">

          <option value="13">Arlington</option>
          <option value="4">Atlanta</option>
          <option value="1">Austin</option>
          <option value="9">Boston</option>
          <option value="8">Chicago</option>
          <option value="3">Columbus</option>
          <option value="0">Denver</option>
          <option value="10">Kansas City</option>
          <option value="14">Minneapolis</option>
          <option value="7">Phoenix</option>
          <option value="11">Raleigh</option>
          <option value="6">Richmond</option>

        </div>
        <div class="tabs" role="tablist" aria-label="Person views"><sc-for list="{{pvTabs}}" as="t" hint-placeholder-count="2"><button type="button" role="tab" class="{{t.cls}}" aria-selected="{{t.on}}" onClick="{{t.pick}}">{{t.label}}</button></sc-for></div>
        <sc-if value="{{pvCompareTab}}" hint-placeholder-val="{{false}}">
          <sc-if value="{{cmpSelf}}" hint-placeholder-val="{{false}}"><p class="small" style="margin: 0">This is you. Pick someone else from the list to compare with.</p></sc-if>
          <sc-if value="{{cmpHasPerson}}" hint-placeholder-val="{{true}}">
          <p class="sub" style="margin: 0">Your access compared with {{cmp.first}}’s. Select items to mirror, or request them one at a time.</p>

            <div class="cmpcol">
              <div class="row between"><h3>They have, you don’t ({{cmp.theirN}})</h3><sc-if value="{{cmp.canAll}}" hint-placeholder-val="{{false}}"><button type="button" class="link" onClick="{{cmpSelectAll}}">Select all</button></sc-if></div>
              <sc-for list="{{cmp.theirs}}" as="x" hint-placeholder-count="3">
                <div class="cmpitem">
                  <sc-if value="{{x.mirrorable}}" hint-placeholder-val="{{true}}"><button type="button" class="chk {{x.chkCls}}" role="checkbox" aria-checked="{{x.on}}" aria-label="Select {{x.name}}" onClick="{{x.toggle}}">{{x.mark}}</button></sc-if>
                  <span class="stack" style="flex: 1"><strong>{{x.name}}</strong><span class="small">{{x.type}} · {{x.via}}</span><sc-if value="{{x.hasTrain}}" hint-placeholder-val="{{false}}"><span class="small"><strong>Training:</strong> <sc-for list="{{x.tl}}" as="l" hint-placeholder-count="1"><a class="tlink" href="{{l.href}}" target="_blank" rel="noopener" onClick="{{l.go}}">{{l.name}} ↗</a> {{l.state}} </sc-for></span></sc-if><sc-if value="{{x.needsForm}}" hint-placeholder-val="{{false}}"><span class="small">Needs its own form. <button type="button" class="link" onClick="{{x.req}}">Request</button></span></sc-if></span>
                </div>
              </sc-for>
              <sc-if value="{{cmp.theirNone}}" hint-placeholder-val="{{false}}"><p class="small" style="margin: 0">Nothing. You already have everything they have.</p></sc-if>
            </div>
            <div class="cmpcol"><h3>You both have ({{cmp.bothN}})</h3><sc-for list="{{cmp.both}}" as="x" hint-placeholder-count="3"><div class="cmpitem"><span class="stack"><strong>{{x.name}}</strong><span class="small">{{x.type}}</span></span></div></sc-for></div>
            <div class="cmpcol"><h3>Only you have ({{cmp.mineN}})</h3><sc-for list="{{cmp.mine}}" as="x" hint-placeholder-count="2"><div class="cmpitem"><span class="stack"><strong>{{x.name}}</strong><span class="small">{{x.type}}</span></span></div></sc-for></div>
          </div>
          <sc-if value="{{cmpHasSel}}" hint-placeholder-val="{{false}}">
            <div class="stack g12" style="border-top: 1px solid #DDD; padding-top: 14px">
              <h3>Request the {{cmpSelN}} selected for yourself</h3>
              <sc-if value="{{cmpTrainHas}}" hint-placeholder-val="{{false}}"><div class="callout warnbox" role="status"><span class="stack g4"><span><strong>Training needed first.</strong> {{cmpTrainTxt}}</span><sc-for list="{{cmpTrainLinks}}" as="l" hint-placeholder-count="1"><span><a class="tlink" href="{{l.href}}" target="_blank" rel="noopener" onClick="{{l.go}}">{{l.name}} ↗</a> {{l.state}}</span></sc-for></span></div></sc-if>
              <fieldset><legend>For how long?</legend><div class="fchips"><sc-for list="{{cmpDurs}}" as="o" hint-placeholder-count="4"><button type="button" class="{{o.cls}}" aria-pressed="{{o.on}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div><span class="hint">Capped at each type of access’s policy maximum.</span></fieldset>
              <label class="f" for="cmpjust">Justification <span class="req">· required</span><textarea id="cmpjust" class="inp" value="{{cmpJust}}" onChange="{{onCmpJust}}" placeholder="What task do you need these for?"></textarea></label>
              <sc-if value="{{cmpShowErr}}" hint-placeholder-val="{{false}}"><div class="errbox" role="alert"><strong>Before you send:</strong><ul><sc-for list="{{cmpMissing}}" as="m" hint-placeholder-count="1"><li>{{m.t}}</li></sc-for></ul></div></sc-if>
              <div><button type="button" class="btn pri" onClick="{{cmpSubmit}}">Request {{cmpSelN}} items</button></div>
              <span class="small">Each access goes to its own owner for approval.</span>
            </div>
          </sc-if>
          </sc-if>
        </sc-if>
        <sc-if value="{{pvAccessTab}}" hint-placeholder-val="{{true}}">
        <sc-for list="{{pv.affs}}" as="af" hint-placeholder-count="1">
          <div class="card">
            <div class="affh"><div><span class="small">{{af.kindLbl}}</span><h3>{{af.role}}</h3><p class="sub">{{af.subLbl}}</p></div><sc-if value="{{af.isSlot}}" hint-placeholder-val="{{true}}"><dl class="affmeta"><div><dt>Supervisor</dt><dd>{{af.sup}}</dd></div><div><dt>Since</dt><dd>{{af.since}}</dd></div><div><dt>Ends</dt><dd>{{af.ends}}</dd></div></dl></sc-if></div>
            <div class="tbl"><div class="dt" role="table" aria-label="Access in the {{af.role}} slot">
              <div class="tr th c-acc" role="row"><span role="columnheader">Access</span><span role="columnheader">Type of access</span><span role="columnheader">Source</span><span role="columnheader">Status</span><span role="columnheader">Granted</span><span role="columnheader">Expires</span><span role="columnheader" class="vh">Action</span></div>
              <sc-for list="{{af.rows}}" as="x" hint-placeholder-count="2"><div class="tr c-acc" role="row"><span role="cell"><strong>{{x.name}}</strong><span class="mono small blk">{{x.path}}</span></span><span role="cell">{{x.typeName}}</span><span role="cell">{{x.src}}</span><span role="cell"><span class="{{x.cls}}">{{x.status}}</span></span><span role="cell">{{x.granted}}</span><span role="cell">{{x.expires}}<span class="small blk">{{x.hint}}</span></span><span role="cell" class="right"><button type="button" class="btn sm" onClick="{{x.act}}">{{x.actLabel}}</button></span></div></sc-for>
              <sc-if value="{{af.none}}" hint-placeholder-val="{{false}}"><p class="empty">No access in this slot.</p></sc-if>
            </div></div>
          </div>
        </sc-for>
        </sc-if>
      </section>
    </sc-if>
    <div class="card tbl">
      <div class="dt" role="table" aria-label="People">
        <div class="tr th c-ppl" role="row"><span role="columnheader">Name</span><span role="columnheader">Office</span><span role="columnheader">Job/Role</span><span role="columnheader">Active</span><span role="columnheader">Expiring</span><span role="columnheader" class="vh">Action</span></div>
        <sc-for list="{{pRows}}" as="p" hint-placeholder-count="8">
          <div class="{{p.rowCls}}" role="row"><span role="cell"><strong>{{p.name}}</strong></span><span role="cell">{{p.office}}</span><span role="cell">{{p.title}}</span><span role="cell">{{p.active}}</span><span role="cell"><span class="{{p.expCls}}">{{p.expiring}}</span></span><span role="cell" class="right"><button type="button" class="btn sm" onClick="{{p.open}}">View</button></span></div>
        </sc-for>
        <sc-if value="{{pEmpty}}" hint-placeholder-val="{{false}}"><p class="empty">No one matches. Try another name or office.</p></sc-if>
      </div>
    </div>
  </div>
  </sc-if>

  <!-- ============ MY TEAM (ADMIN) ============ -->
  <sc-if value="{{isAdmin}}" hint-placeholder-val="{{false}}">
  <div class="stack g20">

    <sc-if value="{{isTeamTab}}" hint-placeholder-val="{{true}}">
      <div class="cols">
        <section class="colMain card pad stack g16" aria-labelledby="tm-h">
          <h2 id="tm-h">Members</h2>
          <div class="tbl"><div class="dt" role="table" aria-label="Team members" style="min-width: 700px">
            <div class="tr th c-mem" role="row"><span role="columnheader">Member</span><span role="columnheader">Team role</span><span role="columnheader" class="vh">Action</span></div>
            <sc-for list="{{tm.members}}" as="m" hint-placeholder-count="3">
              <div class="tr c-mem" role="row" style="align-items: center">
                <span role="cell"><strong>{{m.name}}</strong><span class="small blk">{{m.sub}}</span></span>
                <span role="cell"><select class="inp" aria-label="{{m.label}}" value="{{m.role}}" onChange="{{m.onRole}}"><option value="Approver">Approver</option><option value="Admin">Admin</option><option value="Observer">Observer</option></select></span>
                <span role="cell" class="right row g8" style="justify-content: flex-end"><button type="button" class="btn sm" onClick="{{m.addTemp}}">Add temporary access</button><button type="button" class="btn sm danger" onClick="{{m.remove}}" aria-label="Remove {{m.name}}">Remove</button></span>
              </div>

            <h3>Add a member</h3>
            <div class="row g12" style="align-items: flex-end">
              <label class="f grow" for="addq">Find a person<input id="addq" class="inp" type="search" placeholder="Start typing a name" value="{{addQ}}" onChange="{{onAddQ}}"></label>
              <label class="f" for="addrole" style="min-width: 160px">As<select id="addrole" class="inp" value="{{addRole}}" onChange="{{onAddRole}}"><option value="Approver">Approver</option><option value="Admin">Admin</option><option value="Observer">Observer</option></select></label>
            </div>
            <div class="stack g4"><sc-for list="{{addResults}}" as="p" hint-placeholder-count="2"><div class="row between" style="padding: 6px 0; border-bottom: 1px solid #EEE"><span><strong>{{p.name}}</strong><span class="small blk">{{p.sub}}</span></span><button type="button" class="btn sm" onClick="{{p.add}}">Add</button></div></sc-for></div>
            <sc-if value="{{addNone}}" hint-placeholder-val="{{false}}"><span class="small">No one else matches, or they’re already on this team.</span></sc-if>
          </div>
        </section>
        <section class="colSide card pad stack g8" aria-labelledby="ts-h">
          <h2 id="ts-h">Team settings</h2>
          <div class="tog"><input type="checkbox" id="t-auto" checked="{{tm.auto}}" onChange="{{tm.onAuto}}"><label for="t-auto" class="stack"><strong>Auto-approve slot assignments</strong><span class="small">When an admin fills one of this team’s slots, access starts right away with no approval step.</span></label></div>
          <label class="f" for="t-esc" style="padding-top: 8px">Escalate slot approvals after
            <select id="t-esc" class="inp" value="{{tm.esc}}" onChange="{{tm.onEsc}}"><option value="1">1 business day</option><option value="2">2 business days</option><option value="3">3 business days</option><option value="5">5 business days</option></select>
            <span class="hint">Then it goes to the supervisor’s supervisor, or to the team admin if there is none.</span>
          </label>
        </section>
      </div>
    </sc-if>

    <sc-if value="{{isPolTab}}" hint-placeholder-val="{{false}}">
      <div class="callout"><span>Changes apply to new requests right away. When a request waits longer than the typical time, it escalates to the next level up.</span></div>

        <div class="dt" role="table" aria-label="Access policies" style="min-width: 900px">
          <div class="tr th c-pol" role="row"><span role="columnheader">Type of access</span><span role="columnheader">Approval path</span><span role="columnheader">Max duration</span><span role="columnheader">Typical time</span><span role="columnheader">Required training</span><span role="columnheader">Expiry reminder</span></div>
          <sc-for list="{{polRows}}" as="p" hint-placeholder-count="9">
            <div class="tr c-pol" role="row" style="align-items: center">
              <span role="cell"><strong>{{p.name}}</strong></span>

              <span role="cell"><select class="inp" aria-label="{{p.lblMax}}" value="{{p.max}}" onChange="{{p.onMax}}"><option value="14">14 days</option><option value="30">30 days</option><option value="60">60 days</option><option value="90">90 days</option><option value="180">180 days</option><option value="365">1 year</option></select></span>
              <span role="cell"><select class="inp" aria-label="{{p.lblSla}}" value="{{p.sla}}" onChange="{{p.onSla}}"><option value="1">1 business day</option><option value="2">2 business days</option><option value="3">3 business days</option><option value="4">4 business days</option><option value="5">5 business days</option></select></span>
              <span role="cell" class="small">{{p.trainTxt}}</span>
              <span role="cell"><select class="inp" aria-label="{{p.lblRem}}" value="{{p.remind}}" onChange="{{p.onRemind}}"><option value="7">7 days before</option><option value="14">14 days before</option><option value="30">30 days before</option></select></span>
            </div>
          </sc-for>
        </div>
      </div>
      <div class="card tbl">
        <div class="pad" style="padding-bottom: 8px"><h2>Trainings</h2><p class="sub">How often each training must be retaken to keep the access that depends on it.</p></div>
        <div class="dt" role="table" aria-label="Trainings" style="min-width: 760px">
          <div class="tr th c-tpol" role="row"><span role="columnheader">Course</span><span role="columnheader">Retake</span><span role="columnheader">Required for</span><span role="columnheader">Overdue</span></div>
          <sc-for list="{{tpRows}}" as="t" hint-placeholder-count="5"><div class="tr c-tpol" role="row" style="align-items: center"><span role="cell"><strong>{{t.name}}</strong></span><span role="cell"><select class="inp" aria-label="{{t.lbl}}" value="{{t.months}}" onChange="{{t.onMonths}}"><option value="0">Once</option><option value="12">Every year</option><option value="24">Every 2 years</option></select></span><span role="cell" class="small">{{t.req}}</span><span role="cell">{{t.overdue}}</span></div></sc-for>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isSetTab}}" hint-placeholder-val="{{false}}">
      <section class="card pad" aria-label="Settings">
        <sc-for list="{{setRows}}" as="s" hint-placeholder-count="4">
          <div class="tog"><input type="checkbox" id="{{s.id}}" checked="{{s.on}}" onChange="{{s.toggle}}"><label for="{{s.id}}" class="stack"><strong>{{s.label}}</strong><span class="small">{{s.help}}</span></label></div>

  </div>
  </main>
</div>

    out.tpRows = D.trainings.map(t => ({ name: t.name, months: String(t.months), lbl: 'Retake schedule for ' + t.name, onMonths: e => { t.months = Number(e.target.value); this.flash(t.name + ': ' + this.renews(t).toLowerCase() + '.'); }, req: D.resList.filter(x => x.trainings.indexOf(t.id) >= 0).map(x => x.name).join(', ') || '—', overdue: D.users.filter(p => this.tStatus(p.i, t.id).state === 'expired' && this.active(p.i).some(x => D.res[x.res].trainings.indexOf(t.id) >= 0)).length + ' people' }));
    out.setRows = [['remind', 'Expiry reminders', 'Email people before their access or slot ends, using each policy’s reminder window.'], ['autoRevoke', 'Revoke when a slot ends', 'Remove all access tied to a slot on the day it ends.'], ['digest', 'Daily approver digest', 'Send approvers one summary of pending and escalated requests each morning.'], ['delegate', 'Out-of-office delegation', 'Approvers can hand their queue to a teammate while away.']].map(s => ({ id: 'set-' + s[0], label: s[1], help: s[2], on: !!D.settings[s[0]], toggle: e => { D.settings[s[0]] = e.target.checked; this.forceUpdate(); } }));

    return out;
  }
}
